services:
  postgres:
    image: postgres:16-alpine
    container_name: codequest-db
    environment:
      POSTGRES_DB: codequest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - codequest-data:/var/lib/postgresql/data

volumes:
  codequest-data:
