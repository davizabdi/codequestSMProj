<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Questões</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: navBreadcrumb(active='quiz')}"></header>

<div class="admin-wrapper">
    <a href="/admin/modulos" class="admin-breadcrumb-link">&larr; Voltar para módulos</a>

    <div class="admin-header">
        <div>
            <div class="section-label">// QUESTÕES DO MÓDULO</div>
            <h1 class="auth-title" style="margin-bottom:0;" th:text="${modulo.titulo}">Título do módulo</h1>
        </div>
        <a th:href="@{/admin/modulos/{moduloId}/questoes/novo(moduloId=${modulo.id})}" class="btn btn-primary">
            + Nova questão
        </a>
    </div>

    <div class="table-scroll" th:if="${!#lists.isEmpty(questoes)}">
    <table class="admin-table">
        <thead>
        <tr>
            <th>#</th>
            <th>Enunciado</th>
            <th>Correta</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="questao : ${questoes}">
            <td th:text="${questao.ordem}">1</td>
            <td th:text="${questao.enunciado}">Enunciado da questão</td>
            <td><span class="tag tag-green" th:text="${questao.correta}">A</span></td>
            <td class="actions">
                <a th:href="@{/admin/modulos/{moduloId}/questoes/{id}/editar(moduloId=${modulo.id},id=${questao.id})}"
                   class="btn btn-secondary">Editar</a>
                <form th:action="@{/admin/modulos/{moduloId}/questoes/{id}/excluir(moduloId=${modulo.id},id=${questao.id})}"
                      method="post" onsubmit="return confirm('Excluir esta questão?');">
                    <button type="submit" class="btn btn-danger">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(questoes)}">
        Nenhuma questão cadastrada para este módulo ainda.
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
